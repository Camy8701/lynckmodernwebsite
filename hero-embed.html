<!doctype html>
<html
  lang="en" class="notranslate" translate="no"><head><meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LYNCK STUDIO PRO | 3D Portfolio</title>
    <link rel="preconnect" href="https://esm.sh">
    <!-- Polyfill for React/Three ecosystem -->
    <script>
    window.process = { env: { NODE_ENV: 'production' } };
    </script>
    <!-- Import Map: Critical for module resolution -->
    <script type="importmap">
    {
    "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "three": "https://esm.sh/three@0.160.0",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.16?external=react,react-dom,three",
    "@react-three/drei": "https://esm.sh/@react-three/drei@9.99.0?external=react,react-dom,three,@react-three/fiber"
    }
    }
    </script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #050505;
      background-image: url("assets/hero-bg-glass-sphere.webp");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }
    #root { width: 100vw; height: 100vh; height: 100dvh; }
    /* Error overlay */
    #error-overlay { display: none; }
    </style></head>
    <body class="antialiased text-white selection:bg-white selection:text-black">

        <!-- Error Fallback -->
        <div id="error-overlay" class="fixed inset-0 z-[10000] flex items-center justify-center bg-black text-red-500 p-10 font-mono text-xs">
            System Malfunction. Check Console.
        </div>

        <!-- React Root -->
        <div id="root"></div>

        <!-- Main Application Logic -->
        <script type="text/babel" data-type="module">
            import React, { useRef, useState, useEffect, Suspense } from 'react';
            import { createRoot } from 'react-dom/client';
            import * as THREE from 'three';
            import { Canvas, useFrame, useThree } from '@react-three/fiber';
            import { ScrollControls, useScroll, Image, Text, Float, Sparkles } from '@react-three/drei';

            // --- Responsive Text Sizing ---
            // At FOV 45, camera z=2, the visible width at z=0 is:
            // 2 * tan(FOV/2) * distance * aspect = 2 * tan(22.5°) * 2 * aspect
            // "STUDIO" at fontSize 1.2 with letterSpacing -0.08 is ~4.5 world units wide
            // On desktop (16:9 aspect ~1.78) visible width ≈ 2 * 0.414 * 2 * 1.78 ≈ 2.95 → 1.2 fits
            // On mobile (390/844 aspect ~0.46) visible width ≈ 2 * 0.414 * 2 * 0.46 ≈ 0.76 → need much smaller
            // Using wider FOV on mobile helps: FOV 70 → tan(35°)=0.7 → visible width ≈ 2*0.7*2*0.46 = 1.29
            function getResponsiveValues() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                const aspect = w / h;

                // Camera at z=2, titleGroup lerps to camera.z - 4 = -2
                // So text is at world z≈-2, camera-to-text distance ≈ 4
                // visibleWidth = 2 * tan(fov/2) * distance * aspect
                const fov = w < 480 ? 70 : w < 768 ? 58 : w < 1024 ? 48 : 45;
                const distance = 4; // camera z=2 to text z=-2
                const visibleWidth = 2 * Math.tan((fov / 2) * Math.PI / 180) * distance * aspect;
                // "STUDIO" with Inter, letterSpacing -0.08 is about 3.3x fontSize
                // Allow 15% padding on each side
                const maxFontSize = visibleWidth / (3.3 * 1.3);
                const baseFontSize = w < 480 ? 0.5 : w < 768 ? 0.75 : w < 1024 ? 0.9 : 1.2;
                const fontSize = Math.min(baseFontSize, maxFontSize);
                const gap = fontSize * 0.75;
                return { fontSize, gap, fov };
            }

            // --- Configuration ---
            const IMAGES = [
                { position: [1.5, 0, -3], rotation: [0, -0.2, 0], url: "assets/cyberpunk-portrait-with-red-laser-beam-4k.webp" },
                { position: [-1.8, 1, -7], rotation: [0, 0.2, 0], url: "assets/3d-office-building-with-google-map-pin-4k.webp" },
                { position: [2, -1, -11], rotation: [0, -0.3, 0], url: "assets/glowing-crystal-thoughts-emerge-from-glass-head-4k.webp" },
                { position: [-1.5, -2, -15], rotation: [0, 0.2, 0], url: "assets/3d-website-seo-concept-illustration-4k.webp" },
                { position: [1.2, 1.5, -19], rotation: [0, -0.1, 0], url: "assets/futuristic-neon-data-visualization-panel-4k.webp" },
                { position: [-2, 0.5, -23], rotation: [0, 0.3, 0], url: "assets/cyberpunk-portrait-with-reflective-visor-4k.webp" },
            ];

            const CTA_LABELS = {
                en: "Let's explore",
                de: "Jetzt entdecken",
            };

            const notifyHeroReady = (() => {
                let sent = false;
                return () => {
                    if (sent) return;
                    sent = true;
                    try {
                        if (window.parent && window.parent !== window) {
                            window.parent.postMessage({ type: 'hero-ready' }, window.location.origin);
                        }
                    } catch (e) {
                        try {
                            if (window.parent && window.parent !== window) {
                                window.parent.postMessage({ type: 'hero-ready' }, '*');
                            }
                        } catch (_) {}
                    }
                };
            })();

            function getActiveLanguage() {
                const params = new URLSearchParams(window.location.search);
                const paramLang = params.get('lang');
                if (paramLang === 'de' || paramLang === 'en') return paramLang;
                try {
                    const stored = localStorage.getItem('language');
                    if (stored === 'de' || stored === 'en') return stored;
                } catch (e) {}
                try {
                    if (window.parent && window.parent.location && window.parent.location.pathname.includes('/de/')) {
                        return 'de';
                    }
                } catch (e) {}
                return 'en';
            }

            function getCtaLabel() {
                const lang = getActiveLanguage();
                return CTA_LABELS[lang] || CTA_LABELS.en;
            }

            function CustomImage({ position, rotation, url }) {
                const ref = useRef();
                const [hovered, setHover] = useState(false);

                const imgScale = window.innerWidth < 768 ? 0.6 : 1;

                useFrame(() => {
                    if (!ref.current) return;
                    const targetScale = hovered ? 1.15 : 1;
                    ref.current.scale.x = THREE.MathUtils.lerp(ref.current.scale.x, targetScale * 2 * imgScale, 0.1);
                    ref.current.scale.y = THREE.MathUtils.lerp(ref.current.scale.y, targetScale * 3 * imgScale, 0.1);
                    ref.current.material.grayscale = THREE.MathUtils.lerp(ref.current.material.grayscale, hovered ? 0 : 0.3, 0.1);
                    ref.current.material.color.lerp(new THREE.Color(hovered ? '#ffffff' : '#e0e0e0'), 0.1);
                });

                return (
                    <Float speed={2} rotationIntensity={0.1} floatIntensity={0.5}>
                        <Image
                            ref={ref}
                            url={url}
                            position={position}
                            rotation={rotation}
                            scale={[2, 3, 1]}
                            onPointerOver={() => { document.body.style.cursor = 'pointer'; setHover(true); }}
                            onPointerOut={() => { document.body.style.cursor = 'auto'; setHover(false); }}
                            transparent
                            opacity={0.9}
                        />
                    </Float>
                );
            }

            function SceneContent() {
                const { camera } = useThree();
                const scroll = useScroll();
                const titleGroup = useRef();
                const titleRefs = useRef([]);
                const ctaRef = useRef();
                const scrollSmooth = useRef(0);
                const [ctaLabel, setCtaLabel] = useState(() => getCtaLabel());
                const initVals = getResponsiveValues();
                const [fontSize, setFontSize] = useState(() => initVals.fontSize);
                const [gap, setGap] = useState(() => initVals.gap);

                useEffect(() => {
                    const onResize = () => {
                        const v = getResponsiveValues();
                        setFontSize(v.fontSize);
                        setGap(v.gap);
                    };
                    window.addEventListener('resize', onResize);
                    return () => window.removeEventListener('resize', onResize);
                }, []);

                useEffect(() => {
                    const updateCta = () => setCtaLabel(getCtaLabel());
                    updateCta();
                    window.addEventListener('storage', updateCta);
                    return () => window.removeEventListener('storage', updateCta);
                }, []);

                useEffect(() => {
                    let cancelled = false;
                    const waitForTitleSync = () => {
                        const nodes = titleRefs.current.filter(Boolean);
                        if (nodes.length < 3) {
                            if (!cancelled) requestAnimationFrame(waitForTitleSync);
                            return;
                        }

                        const syncPromises = nodes.map((node) => (
                            new Promise((resolve) => {
                                if (node && typeof node.sync === 'function') {
                                    node.sync(() => resolve());
                                } else {
                                    resolve();
                                }
                            })
                        ));

                        Promise.all(syncPromises).then(() => {
                            if (cancelled) return;
                            requestAnimationFrame(() => {
                                if (cancelled) return;
                                notifyHeroReady();
                            });
                        }).catch(() => {
                            // If sync APIs are unavailable, keep fallback visible until text refs exist.
                        });
                    };

                    waitForTitleSync();

                    return () => {
                        cancelled = true;
                    };
                }, []);

                useFrame((state) => {
                    // Rig Logic
                    const targetZ = 2 - (scroll.offset * 28);
                    camera.position.z = THREE.MathUtils.lerp(camera.position.z, targetZ, 0.08);

                    // Parallax (further reduced for stability)
                    camera.position.x = THREE.MathUtils.lerp(camera.position.x, -state.mouse.x * 0.12, 0.06);
                    camera.position.y = THREE.MathUtils.lerp(camera.position.y, -state.mouse.y * 0.12, 0.06);

                    // Text Animation (scroll-scrubbed split-title fade/transform)
                    scrollSmooth.current = THREE.MathUtils.lerp(scrollSmooth.current, scroll.offset, 0.08);
                    if (titleGroup.current) {
                        titleGroup.current.position.z = THREE.MathUtils.lerp(titleGroup.current.position.z, camera.position.z - 4, 0.35);
                        titleGroup.current.rotation.x = -state.mouse.y * 0.06;
                        titleGroup.current.rotation.y = state.mouse.x * 0.06;
                    }

                    const t = Math.min(1, scrollSmooth.current * 1.25);
                    const opacity = Math.max(0, 1 - t);
                    const xSpread = window.innerWidth < 768 ? 2 : 4;
                    const scaleMid = THREE.MathUtils.lerp(1, 2, t);

                    if (titleRefs.current[0]) {
                        titleRefs.current[0].position.x = THREE.MathUtils.lerp(0, -xSpread, t);
                        titleRefs.current[0].material.opacity = opacity;
                    }
                    if (titleRefs.current[1]) {
                        titleRefs.current[1].scale.set(scaleMid, scaleMid, scaleMid);
                        titleRefs.current[1].material.opacity = opacity;
                    }
                    if (titleRefs.current[2]) {
                        titleRefs.current[2].position.x = THREE.MathUtils.lerp(0, xSpread, t);
                        titleRefs.current[2].material.opacity = opacity;
                    }

                    // Fade CTA out as scroll approaches the section handoff.
                    if (ctaRef.current) {
                        const ctaFade = THREE.MathUtils.clamp((scrollSmooth.current - 0.74) / 0.2, 0, 1);
                        ctaRef.current.material.opacity = 1 - ctaFade;
                    }

                    // DOM Updates (removed overlay UI)
                });

                return (
                    <>
                        <group ref={titleGroup}>
                            <group>
                                <Text
                                    ref={(el) => { titleRefs.current[0] = el; }}
                                    font="https://fonts.gstatic.com/s/inter/v12/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyfAZ9hjp-Ek-_EeA.woff"
                                    fontSize={fontSize}
                                    letterSpacing={-0.08}
                                    color="#ffffff"
                                    renderOrder={30}
                                    material-transparent={true}
                                    material-depthWrite={false}
                                    material-depthTest={false}
                                    material-toneMapped={false}
                                    outlineWidth={0}
                                    outlineOpacity={0}
                                    strokeWidth={0}
                                    anchorX="center"
                                    anchorY="middle"
                                    position={[0, gap, 0]}
                                >
                                    LYNCK
                                </Text>
                                <Text
                                    ref={(el) => { titleRefs.current[1] = el; }}
                                    font="https://fonts.gstatic.com/s/inter/v12/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyfAZ9hjp-Ek-_EeA.woff"
                                    fontSize={fontSize}
                                    letterSpacing={-0.08}
                                    color="#ffffff"
                                    renderOrder={31}
                                    material-transparent={true}
                                    material-depthWrite={false}
                                    material-depthTest={false}
                                    material-toneMapped={false}
                                    outlineWidth={0}
                                    outlineOpacity={0}
                                    strokeWidth={0}
                                    anchorX="center"
                                    anchorY="middle"
                                    position={[0, 0, 0]}
                                >
                                    STUDIO
                                </Text>
                                <Text
                                    ref={(el) => { titleRefs.current[2] = el; }}
                                    font="https://fonts.gstatic.com/s/inter/v12/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyfAZ9hjp-Ek-_EeA.woff"
                                    fontSize={fontSize}
                                    letterSpacing={-0.08}
                                    color="#ffffff"
                                    renderOrder={32}
                                    material-transparent={true}
                                    material-depthWrite={false}
                                    material-depthTest={false}
                                    material-toneMapped={false}
                                    outlineWidth={0}
                                    outlineOpacity={0}
                                    strokeWidth={0}
                                    anchorX="center"
                                    anchorY="middle"
                                    position={[0, -gap, 0]}
                                >
                                    PRO
                                </Text>
                            </group>
                        </group>

                        {IMAGES.map((img, i) => (
                            <CustomImage key={i} {...img} />
                        ))}

                        <Sparkles count={200} scale={[15, 15, 30]} size={2} speed={0.4} opacity={0.3} color="#ffffff" position={[0, 0, -10]} />

                        <Text
                            ref={ctaRef}
                            position={[0, 0, -28]}
                            fontSize={fontSize * 0.33}
                            letterSpacing={0.1}
                            color="#ffffff"
                            material-transparent={true}
                            material-toneMapped={false}
                            outlineWidth={0}
                            outlineOpacity={0}
                            strokeWidth={0}
                            anchorX="center"
                            anchorY="middle"
                        >
                            {ctaLabel}
                        </Text>
                    </>
                )
            }

            function App() {
                const { fov } = getResponsiveValues();
                return (
                    <Canvas
                        gl={{ antialias: true, toneMapping: THREE.ReinhardToneMapping, powerPreference: "high-performance" }}
                        camera={{ position: [0, 0, 2], fov: fov }}
                        dpr={[1, 2]}
                    >
                        <fog attach="fog" args={['#050505', 4, 20]} />
                        <ambientLight intensity={0.5} />
                        <Suspense fallback={null}>
                            <ScrollControls pages={5} damping={0.2}>
                                <SceneContent />
                            </ScrollControls>
                        </Suspense>
                    </Canvas>
                );
            }

            const container = document.getElementById('root');
            const root = createRoot(container);

            try {
                root.render(<App />);
            } catch (e) {
                console.error(e);
                document.getElementById('error-overlay').style.display = 'flex';
            }
        </script>

    </body></html>
