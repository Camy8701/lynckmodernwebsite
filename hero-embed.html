<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LYNCK STUDIO PRO | Hero</title>
  <link rel="preload" href="/assets/inter-hero.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/hero-bg-glass-sphere.webp" as="image" fetchpriority="high">
  <style>
    @font-face {
      font-family: 'HeroInter';
      src: url('/assets/inter-hero.woff2') format('woff2');
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
    }

    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
      font-family: 'HeroInter', Inter, 'Space Grotesk', system-ui, sans-serif;
    }

    .hero-stage {
      position: relative;
      width: 100%;
      height: 100%;
      isolation: isolate;
      background:
        linear-gradient(180deg, rgba(3, 6, 10, 0.16), rgba(3, 6, 10, 0.62)),
        url('/assets/hero-bg-glass-sphere.webp') center / cover no-repeat;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(120% 86% at 50% 0%, rgba(0, 0, 0, 0.12) 0%, rgba(0, 0, 0, 0.58) 72%),
        linear-gradient(180deg, rgba(6, 7, 12, 0.08) 0%, rgba(6, 7, 12, 0.46) 100%);
      z-index: 1;
    }

    .hero-panels {
      position: absolute;
      inset: clamp(90px, 14vh, 130px) clamp(8vw, 13vw, 220px) clamp(14vh, 19vh, 170px) clamp(10vw, 15vw, 240px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(10px, 1.6vw, 18px);
      z-index: 2;
      opacity: 0.88;
      pointer-events: none;
    }

    .hero-panel {
      position: relative;
      border-radius: clamp(14px, 1.6vw, 24px);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(7, 11, 18, 0.32);
      box-shadow: 0 28px 60px rgba(0, 0, 0, 0.35);
      transform: translate3d(0, 0, 0);
      will-change: transform;
    }

    .hero-panel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(1.05) contrast(1.02);
      opacity: 0.92;
    }

    .hero-panel.main {
      grid-column: 1 / span 2;
      min-height: 36%;
      max-height: 44%;
    }

    .hero-panel.side {
      min-height: 42%;
    }

    .hero-title {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: clamp(0.18rem, 0.65vh, 0.58rem);
      z-index: 3;
      pointer-events: none;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.42s ease, transform 0.42s ease;
    }

    .hero-stage.is-ready .hero-title {
      opacity: 1;
      transform: translateY(0);
    }

    .hero-title-line {
      margin: 0;
      font-size: clamp(3.4rem, 14vw, 14rem);
      line-height: 0.84;
      letter-spacing: -0.075em;
      font-weight: 520;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 6px 26px rgba(0, 0, 0, 0.3);
      white-space: nowrap;
    }

    .hero-cta {
      position: absolute;
      left: 50%;
      bottom: clamp(42px, 6vh, 72px);
      transform: translateX(-50%);
      z-index: 4;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 170px;
      min-height: 46px;
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(8, 14, 30, 0.56);
      backdrop-filter: blur(6px);
      color: #fff;
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.4s ease 0.1s;
      pointer-events: none;
    }

    .hero-stage.is-ready .hero-cta {
      opacity: 1;
      pointer-events: auto;
    }

    @media (max-width: 900px) {
      .hero-panels {
        inset: clamp(92px, 16vh, 136px) 12vw clamp(17vh, 22vh, 220px);
        grid-template-columns: 1fr;
        opacity: 0.8;
      }

      .hero-panel.main,
      .hero-panel.side {
        grid-column: auto;
        min-height: 27%;
      }

      .hero-title {
        gap: 0.2rem;
      }

      .hero-title-line {
        font-size: clamp(3rem, 18vw, 7.2rem);
      }

      .hero-cta {
        bottom: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="hero-stage" data-hero-stage>
    <div class="hero-overlay" aria-hidden="true"></div>

    <section class="hero-panels" aria-hidden="true">
      <article class="hero-panel main" data-parallax data-depth="0.55">
        <img src="/assets/cyberpunk-portrait-with-red-laser-beam-4k.webp" alt="" decoding="async" loading="eager" fetchpriority="high">
      </article>
      <article class="hero-panel side" data-parallax data-depth="0.95">
        <img src="/assets/3d-office-building-with-google-map-pin-4k.webp" alt="" decoding="async" loading="lazy">
      </article>
      <article class="hero-panel side" data-parallax data-depth="1.1">
        <img src="/assets/glowing-crystal-thoughts-emerge-from-glass-head-4k.webp" alt="" decoding="async" loading="lazy">
      </article>
    </section>

    <section class="hero-title" data-hero-title aria-label="LYNCK Studio Pro">
      <h1 class="hero-title-line">LYNCK</h1>
      <h1 class="hero-title-line">STUDIO</h1>
      <h1 class="hero-title-line">PRO</h1>
    </section>

    <a class="hero-cta" data-hero-cta href="javascript:void(0)">Let's explore</a>
  </main>

  <script src="/js/hero-embed.js" defer></script>
</body>
</html>
